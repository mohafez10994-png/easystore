<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a8fa8"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><title>حسابات ومخازن</title>
<style>
:root{--bg:#f2f6f8;--card:#fff;--tx:#1b2a33;--mut:#6b7c86;--pri:#2a8fa8;--bd:#dbe5ea;--ok:#1a8a4a;--bad:#c63c3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a20;--card:#18262e;--tx:#e6eef2;--mut:#93a5af;--pri:#2a8fa8;--bd:#2a3b45;--ok:#4cc27d;--bad:#ef6b6b}}
:root[data-theme="dark"]{--bg:#0f1a20;--card:#18262e;--tx:#e6eef2;--mut:#93a5af;--pri:#2a8fa8;--bd:#2a3b45;--ok:#4cc27d;--bad:#ef6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;font-size:15px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pri);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--pri);color:#fff;display:flex;align-items:center;gap:8px;padding:12px 14px;z-index:9}
header b{flex:1;font-size:18px}
#back{background:none;border:0;color:#fff;font-size:26px;cursor:pointer;padding:0 6px}
main{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 8px;text-align:center;font:inherit;color:var(--tx);cursor:pointer}
.tile span{display:block;font-size:28px;margin-bottom:6px}
.stat{display:flex;gap:10px;margin-bottom:12px}.stat div{flex:1;background:var(--pri);color:#fff;border-radius:14px;padding:12px;text-align:center}
.stat small{display:block;opacity:.85}.stat b{font-size:20px}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.btn{width:100%;margin-top:14px;padding:12px;border:0;border-radius:12px;background:var(--pri);color:#fff;font:inherit;font-weight:bold;cursor:pointer}
.btn.sec{background:none;color:var(--pri);border:1px dashed var(--pri);margin-top:8px}
.ln{display:grid;grid-template-columns:2fr 1fr 1fr 34px;gap:6px;margin-top:6px}.lh{display:grid;grid-template-columns:2fr 1fr 1fr 34px;gap:6px;color:var(--mut);font-size:12px}
.x{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer}
.tot{margin-top:12px;font-size:17px}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row small{color:var(--mut);display:block}.pos{color:var(--ok)}.neg{color:var(--bad)}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}.seg .on{background:var(--pri);color:#fff;border-color:var(--pri)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:20}
.empty{text-align:center;color:var(--mut);padding:20px}
table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid var(--bd);padding:6px;text-align:center}
@media print{header,#toast,.no-print,body::before{display:none!important}body,.card{background:#fff!important;color:#000!important;border:0!important}main{max-width:none}th,td,.row{border-color:#888!important}.row small{color:#444}}
</style></head><body>
<header><button id="back" onclick="go('home')" aria-label="رجوع">›</button><b id="ttl"></b></header>
<main id="app"></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const KEY='easystore_v1';
let S={parties:[],items:[],txs:[],t:0},cur='home',ctx=null,dbDoc=null,timer;
try{const s=localStorage.getItem(KEY);if(s)S=JSON.parse(s)}catch(e){}
const P=id=>S.parties.find(p=>p.id===id),I=id=>S.items.find(i=>i.id===id);
const K={sale:'فاتورة مبيعات',purchase:'فاتورة مشتريات',return:'مرتجع مبيعات',preturn:'مرتجع مشتريات',expense:'مصروف',income:'إيراد',payin:'سداد عميل',payout:'سداد مورد',open:'رصيد افتتاحي'};
const delta=t=>t.k==='sale'||t.k==='purchase'?t.total-t.paid:(t.k==='return'||t.k==='preturn')?-(t.total-t.paid):t.k==='open'?t.total:(t.k==='payin'||t.k==='payout')?-t.total:0;
const cashOf=t=>({sale:t.paid,purchase:-t.paid,return:-t.paid,preturn:t.paid,expense:-t.total,income:t.total,payin:t.total,payout:-t.total})[t.k]||0;
const bal=pid=>S.txs.filter(t=>t.pid===pid).reduce((a,t)=>a+delta(t),0);
const balTxt=p=>{const b=bal(p.id);return (p.type==='customer'?(b>=0?'عليه ':'له '):(b>=0?'له ':'عليه '))+fmt(Math.abs(b))};
let DB=null,unsubs=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let ROLE='admin';
const WR=['sale','purchase','return','preturn','payin','payout','expense','party','item','count'],canW=()=>ROLE!=='viewer',canD=()=>ROLE==='admin';
function setRole(e){e=(e||'').toLowerCase();const R=window.ROLES||{};ROLE=(R.viewers||[]).includes(e)?'viewer':(R.staff||[]).includes(e)?'staff':(R.admins||[]).includes(e)?'admin':(R.admins?'staff':'admin')}
const who=()=>{try{return firebase.auth().currentUser.email}catch(e){return''}};
function logIt(m){if(DB)DB.collection('logs').add({ts:Date.now(),by:who(),m}).catch(()=>{})}
function persist(col,o){if(col==='txs'&&!o.ts){o.ts=Date.now();o.by=who();logIt('سجّل '+K[o.k]+' '+(o.no||'')+' بقيمة '+fmt(o.total))}if(!DB)return;const d={...o};delete d.id;DB.collection(col).doc(o.id).set(d).catch(()=>toast('تعذر الحفظ، تأكد من الاتصال والصلاحية'))}
function refresh(){if(['home','parties','stock','cash','rep'].includes(cur))go(cur)}
function startSync(){unsubs.forEach(u=>u());unsubs=['parties','items','txs','logs'].map(c=>DB.collection(c).onSnapshot(sn=>{S[c]=sn.docs.map(d=>({id:d.id,...d.data()}));if(c==='txs')S.txs.sort((a,b)=>(a.ts||0)-(b.ts||0));save();refresh()},()=>toast('تعذر تحميل البيانات، تأكد من صلاحية حسابك')))}
function loginScreen(){$('#back').style.visibility='hidden';$('#ttl').textContent='تسجيل الدخول';html(`<div class="card"><label>البريد الإلكتروني</label><input id="em" type="email" autocomplete="username"><label>كلمة المرور</label><input id="pw" type="password" autocomplete="current-password"><button class="btn" onclick="doLogin()">دخول</button><div class="empty" id="lerr"></div></div>`)}
function doLogin(){firebase.auth().signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(()=>{$('#lerr').textContent='بيانات الدخول غير صحيحة'})}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
const T={home:'حسابات ومخازن',sale:'فاتورة مبيعات',purchase:'فاتورة مشتريات',return:'مرتجع مبيعات',preturn:'مرتجع مشتريات',payin:'سداد عميل',payout:'سداد مورد',expense:'المصروفات والإيرادات',party:'عميل / مورد جديد',parties:'العملاء والموردين',item:'صنف',stock:'جرد الأصناف',cash:'حركة الخزينة',rep:'تقارير فورية',stmt:'كشف حساب',inv:'مستند',logs:'سجل النشاط',aging:'أعمار الديون',count:'جرد وتسوية المخزون',stmtp:'كشف حساب للإرسال',backup:'نسخة احتياطية'};
const scr={home,sale:()=>invForm('sale'),purchase:()=>invForm('purchase'),return:()=>invForm('return'),preturn:()=>invForm('preturn'),payin:()=>payForm('payin'),payout:()=>payForm('payout'),expense:expForm,party:partyForm,parties,item:itemForm,stock,cash,rep,stmt,backup,inv,logs,aging,count,stmtp:a=>{sf='';st='';stmtView(a)}};
let curArg,rf=today(),rt=today();
function go(s,a){if(!canW()&&WR.includes(s))return toast('صلاحيتك للعرض فقط');cur=s;curArg=a;ctx=null;$('#ttl').textContent=T[s]||'';$('#back').style.visibility=s==='home'?'hidden':'visible';scr[s](a);scrollTo(0,0)}
const html=h=>$('#app').innerHTML=h;
const opts=(arr,sel)=>arr.map(([v,l])=>`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(l)}</option>`).join('');

function home(){
 const cash=S.txs.reduce((a,t)=>a+cashOf(t),0),td=S.txs.filter(t=>t.k==='sale'&&t.d===today()).reduce((a,t)=>a+t.total,0);
 const tiles=[['sale','🧾'],['purchase','📥'],['payin','🤝'],['payout','💸'],['expense','📒'],['return','↩️'],['preturn','↪️'],['party','➕'],['parties','📇'],['item','🏷️'],['stock','📦'],['cash','🏦'],['rep','📊'],['aging','⏳'],['logs','📜'],['backup','💾']];
 html(`<div class="stat"><div><small>رصيد الخزينة</small><b>${fmt(cash)}</b></div><div><small>مبيعات اليوم</small><b>${fmt(td)}</b></div></div>
 ${lowItems().length?`<div class="card" onclick="go('stock','low')" style="border-color:var(--bad);cursor:pointer">⚠️ ${lowItems().length} صنف وصل للحد الأدنى — اضغط للعرض</div>`:''}<div class="grid">${tiles.filter(([k])=>canW()||['parties','stock','cash','rep','logs','backup','aging'].includes(k)).map(([k,i])=>`<button class="tile" onclick="go('${k}')"><span>${i}</span>${T[k]}</button>`).join('')}</div>`)}

function invForm(k){
 ctx={k,lines:[{iid:'',q:1,p:0}],total:0};const isP=k==='purchase'||k==='preturn',pt=isP?'supplier':'customer';
 html(`<div class="card"><label>${isP?'المورد':'العميل'}</label><select id="pid"><option value="">${isP?'مورد نقدي':'عميل نقدي'}</option>${opts(S.parties.filter(p=>p.type===pt).map(p=>[p.id,p.name]))}</select>
 <label>التاريخ</label><input type="date" id="dt" value="${today()}">
 <label>الأصناف</label><div class="lh"><span>الصنف (المتاح)</span><span>الكمية</span><span>السعر</span><span></span></div><div id="lines"></div>
 <button class="btn sec" onclick="addLine()">+ إضافة صنف</button><div style="display:flex;gap:8px"><div style="flex:1"><label>خصم (مبلغ)</label><input type="number" inputmode="decimal" id="disc" oninput="calc()"></div><div style="flex:1"><label>ضريبة %</label><input type="number" inputmode="decimal" id="taxp" oninput="calc()"></div></div><div class="tot">الإجمالي: <b id="tot">0</b></div>
 <label>${k==='return'?'المبلغ المرتجع نقداً':k==='preturn'?'المبلغ المستلم نقداً':isP?'المدفوع للمورد':'المدفوع من العميل'} (اتركه فارغاً = كامل المبلغ)</label><input type="number" inputmode="decimal" id="paid">
 <label>ملاحظات</label><input id="note"><button class="btn" onclick="saveInv()">حفظ</button></div>`);drawLines()}
function drawLines(){
 $('#lines').innerHTML=ctx.lines.map((l,i)=>`<div class="ln"><select onchange="pick(${i},this.value)"><option value="">اختر</option>${opts(S.items.map(x=>[x.id,x.name+' ('+fmt(x.qty)+')']),l.iid)}</select><input type="number" inputmode="decimal" value="${l.q}" oninput="ctx.lines[${i}].q=+this.value;calc()"><input type="number" inputmode="decimal" value="${l.p}" oninput="ctx.lines[${i}].p=+this.value;calc()"><button class="x" onclick="ctx.lines.splice(${i},1);drawLines()">✕</button></div>`).join('')||'<div class="empty">لا توجد أصناف</div>';calc()}
function pick(i,v){const it=I(v);ctx.lines[i].iid=v;ctx.lines[i].p=it?((ctx.k==='purchase'||ctx.k==='preturn')?it.cost:it.price):0;drawLines()}
function addLine(){if(!S.items.length)return toast('أضف أصنافاً أولاً من شاشة (صنف)');ctx.lines.push({iid:'',q:1,p:0});drawLines()}
function calc(){const sub=ctx.lines.reduce((a,l)=>a+(l.q||0)*(l.p||0),0),d=+$('#disc').value||0,tp=+$('#taxp').value||0;ctx.sub=sub;ctx.disc=d;ctx.taxp=tp;ctx.total=(sub-d)*(1+tp/100);$('#tot').textContent=fmt(ctx.total)}
function saveInv(){
 const L=ctx.lines.filter(l=>l.iid&&l.q>0);if(!L.length)return toast('أضف صنفاً واحداً على الأقل');
 const pid=$('#pid').value,total=ctx.total;let paid=$('#paid').value===''?total:+$('#paid').value;if(!pid)paid=total;
 const lines=L.map(l=>{const it=I(l.iid);const c=it.cost;if(ctx.k==='sale'||ctx.k==='preturn')it.qty-=l.q;else{it.qty+=l.q;if(ctx.k==='purchase')it.cost=l.p}return{n:it.name,q:l.q,p:l.p,c}});
 const tx={id:uid(),no:nextNo(ctx.k),k:ctx.k,d:$('#dt').value||today(),pid,total,paid,sub:ctx.sub,disc:ctx.disc,taxp:ctx.taxp,note:$('#note').value,lines};S.txs.push(tx);L.forEach(l=>persist('items',I(l.iid)));persist('txs',tx);save();toast('تم الحفظ');go('inv',tx.id)}

function payForm(k){
 const pt=k==='payin'?'customer':'supplier';ctx={k};
 html(`<div class="card"><label>${pt==='customer'?'العميل':'المورد'}</label><select id="pid">${opts(S.parties.filter(p=>p.type===pt).map(p=>[p.id,p.name+' — '+balTxt(p)]))}</select>
 <label>المبلغ</label><input type="number" inputmode="decimal" id="amt"><label>التاريخ</label><input type="date" id="dt" value="${today()}"><label>ملاحظات</label><input id="note">
 <button class="btn" onclick="savePay()">حفظ</button></div>`)}
function savePay(){const pid=$('#pid').value,a=+$('#amt').value;if(!pid||!(a>0))return toast('اختر الطرف وأدخل المبلغ');
 const tx={id:uid(),no:nextNo(ctx.k),k:ctx.k,d:$('#dt').value||today(),pid,total:a,paid:a,note:$('#note').value,lines:[]};S.txs.push(tx);persist('txs',tx);save();toast('تم الحفظ');go('inv',tx.id)}

function expForm(){
 html(`<div class="card"><label>النوع</label><select id="k">${opts([['expense','مصروف'],['income','إيراد آخر']])}</select>
 <label>التصنيف / البيان</label><input id="note" placeholder="إيجار، كهرباء، مرتبات..."><label>المبلغ</label><input type="number" inputmode="decimal" id="amt">
 <label>التاريخ</label><input type="date" id="dt" value="${today()}"><button class="btn" onclick="saveExp()">حفظ</button></div>`)}
function saveExp(){const a=+$('#amt').value;if(!(a>0))return toast('أدخل المبلغ');
 const tx={id:uid(),k:$('#k').value,d:$('#dt').value||today(),pid:'',total:a,paid:a,note:$('#note').value,lines:[]};S.txs.push(tx);persist('txs',tx);save();toast('تم الحفظ');go('home')}

function partyForm(){
 html(`<div class="card"><label>النوع</label><select id="type">${opts([['customer','عميل'],['supplier','مورد']])}</select><label>الاسم</label><input id="nm"><label>التليفون</label><input id="ph" type="tel">
 <label>رصيد سابق (اختياري)</label><input type="number" inputmode="decimal" id="ob"><button class="btn" onclick="saveParty()">حفظ</button></div>`)}
function saveParty(){const nm=$('#nm').value.trim();if(!nm)return toast('اكتب الاسم');const id=uid();
 const pr={id,name:nm,phone:$('#ph').value,type:$('#type').value};S.parties.push(pr);persist('parties',pr);const o=+$('#ob').value;
 if(o){const tx={id:uid(),k:'open',d:today(),pid:id,total:o,paid:0,note:'',lines:[]};S.txs.push(tx);persist('txs',tx)}save();toast('تم الحفظ');go('parties')}
function parties(){
 html(S.parties.length?`<input placeholder="🔍 بحث" oninput="filt(this.value)" style="margin-bottom:10px"><div class="card srch">${S.parties.map(p=>`<div class="row" onclick="go('stmt','${p.id}')"><div>${esc(p.name)}<small>${p.type==='customer'?'عميل':'مورد'} ${esc(p.phone)}</small></div><b>${balTxt(p)}</b></div>`).join('')}</div>`:'<div class="empty">لا يوجد عملاء أو موردين بعد</div>')}
function stmt(id){
 const p=P(id);$('#ttl').textContent='كشف حساب: '+p.name;let r=0;
 const rows=S.txs.filter(t=>t.pid===id).map(t=>{r+=delta(t);return`<div class="row"><div>${K[t.k]}<small>${t.d} ${esc(t.note)} ${t.lines.map(l=>esc(l.n)+' ×'+l.q).join('، ')}</small></div><div style="text-align:left">${fmt(t.total)}<small>الرصيد ${fmt(r)}</small></div><button class="x" style="color:var(--pri)" onclick="go('inv','${t.id}')">🖨</button>${canD()?`<button class="x" onclick="delTx('${t.id}')">🗑</button>`:''}</div>`});
 html(`<div class="card"><b>${esc(p.name)}</b> — ${balTxt(p)}</div><button class="btn sec" style="margin:0 0 12px" onclick="go('stmtp','${id}')">🖨 كشف للطباعة / إرسال للعميل</button><div class="card">${rows.reverse().join('')||'<div class="empty">لا توجد حركات</div>'}</div>${canD()?`<button class="btn sec" style="color:var(--bad);border-color:var(--bad)" onclick="delParty('${id}')">🗑 مسح ${p.type==='customer'?'العميل':'المورد'}</button>`:''}`)}

function itemForm(id){
 const it=id?I(id):{name:'',qty:0,cost:'',price:''};ctx={id};
 html(`<div class="card"><label>اسم الصنف</label><input id="nm" value="${esc(it.name)}"><label>الكمية بالمخزن</label><input type="number" inputmode="decimal" id="q" value="${it.qty}">
 <label>سعر الشراء</label><input type="number" inputmode="decimal" id="c" value="${it.cost}"><label>سعر البيع</label><input type="number" inputmode="decimal" id="p" value="${it.price}"><label>الحد الأدنى للتنبيه (اختياري)</label><input type="number" inputmode="decimal" id="mn" value="${it.min||''}">
 <button class="btn" onclick="saveItem()">حفظ</button>${id&&canD()?'<button class="btn sec" style="color:var(--bad);border-color:var(--bad)" onclick="delItem()">🗑 مسح الصنف</button>':''}</div>`)}
function saveItem(){const nm=$('#nm').value.trim();if(!nm)return toast('اكتب اسم الصنف');
 const o={name:nm,qty:+$('#q').value||0,cost:+$('#c').value||0,price:+$('#p').value||0,min:+$('#mn').value||0};
 let it;if(ctx.id){it=I(ctx.id);Object.assign(it,o)}else{it={id:uid(),...o};S.items.push(it)}persist('items',it);save();toast('تم الحفظ');go('stock')}
function delItem(){const it=I(ctx.id);if(!it||!confirm('مسح الصنف '+it.name+'؟ الفواتير القديمة هتفضل زي ما هي.'))return;logIt('مسح الصنف '+it.name);S.items=S.items.filter(x=>x.id!==it.id);if(DB)DB.collection('items').doc(it.id).delete().catch(()=>toast('تعذر المسح'));save();toast('تم المسح');go('stock')}
function undoStock(t){(t.lines||[]).forEach(l=>{const it=S.items.find(x=>x.name===l.n);if(!it)return;it.qty+=((t.k==='sale'||t.k==='preturn')?l.q:-l.q);persist('items',it)})}
function removeTx(t){logIt('مسح '+K[t.k]+' '+(t.no||'')+' بقيمة '+fmt(t.total));undoStock(t);S.txs=S.txs.filter(x=>x.id!==t.id);if(DB)DB.collection('txs').doc(t.id).delete().catch(()=>toast('تعذر المسح'))}
function delTx(id){const t=S.txs.find(x=>x.id===id);if(!t||!confirm('مسح '+K[t.k]+' بقيمة '+fmt(t.total)+'؟'+(t.lines&&t.lines.length?' وهيتم تعديل المخزون.':'')))return;removeTx(t);save();toast('تم المسح');go(cur,curArg)}
function delParty(id){const T=S.txs.filter(t=>t.pid===id);if(!confirm(T.length?'لهذا الطرف '+T.length+' حركة، هيتم مسحها كلها مع الطرف وتعديل المخزون. متأكد؟':'مسح هذا الطرف؟'))return;logIt('مسح طرف: '+(P(id)||{}).name);T.forEach(removeTx);S.parties=S.parties.filter(x=>x.id!==id);if(DB)DB.collection('parties').doc(id).delete().catch(()=>toast('تعذر المسح'));save();toast('تم المسح');go('parties')}
function nextNo(k){return S.txs.filter(t=>t.k===k).reduce((a,t)=>Math.max(a,+t.no||0),0)+1}
function inv(id){
 const t=S.txs.find(x=>x.id===id);if(!t)return go('home');const p=P(t.pid),co=localStorage.getItem('es_co')||'',isI=['sale','purchase','return','preturn'].includes(t.k);
 $('#ttl').textContent=K[t.k];
 const rows=(t.lines||[]).map(l=>`<tr><td>${esc(l.n)}</td><td>${fmt(l.q)}</td><td>${fmt(l.p)}</td><td>${fmt(l.q*l.p)}</td></tr>`).join('');
 html(`<div class="card no-print"><label>اسم الشركة (يظهر في الطباعة)</label><input value="${esc(co)}" oninput="localStorage.setItem('es_co',this.value);$('#pco').textContent=this.value"><button class="btn" onclick="print()">🖨️ طباعة</button></div>
 <div class="card"><h2 id="pco" style="text-align:center;margin:0 0 8px">${esc(co)}</h2><div style="text-align:center;font-weight:bold">${K[t.k]} رقم ${t.no||t.id.slice(0,4).toUpperCase()}</div>
 <div class="row"><span>التاريخ: ${t.d}</span><span>${p?(p.type==='customer'?'العميل: ':'المورد: ')+esc(p.name):'نقدي'}</span></div>
 ${isI&&rows?`<table><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${rows}</table>`:''}
 ${isI&&t.disc?`<div class="row"><span>الخصم</span><b>${fmt(t.disc)}</b></div>`:''}${isI&&t.taxp?`<div class="row"><span>ضريبة ${t.taxp}%</span><b>${fmt((t.sub-(t.disc||0))*t.taxp/100)}</b></div>`:''}<div class="row"><span>${isI?'الإجمالي':'المبلغ'}</span><b>${fmt(t.total)}</b></div>
 ${isI?`<div class="row"><span>المدفوع</span><b>${fmt(t.paid)}</b></div><div class="row"><span>المتبقي</span><b>${fmt(t.total-t.paid)}</b></div>`:''}
 ${t.note?'<div>ملاحظات: '+esc(t.note)+'</div>':''}</div>`)}
function filt(v){document.querySelectorAll('.srch .row').forEach(r=>r.style.display=r.textContent.includes(v)?'':'none')}
function logs(){const L=(S.logs||[]).slice().sort((a,b)=>b.ts-a.ts).slice(0,150);html(`<div class="card">${L.map(l=>`<div class="row"><div>${esc(l.m)}<small>${esc(l.by)}</small></div><small>${new Date(l.ts).toLocaleString('ar-EG')}</small></div>`).join('')||'<div class="empty">لا يوجد نشاط بعد</div>'}</div>`)}
function dl(name,rows){const c='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download=name+'-'+today()+'.csv';a.click()}
function exportCSV(){dl('الحركات',[['الرقم','النوع','التاريخ','الطرف','الإجمالي','المدفوع','المتبقي','ملاحظات','بواسطة']].concat(S.txs.map(t=>[t.no||'',K[t.k],t.d,(P(t.pid)||{}).name||'نقدي',t.total,t.paid,t.total-t.paid,t.note||'',t.by||''])))}
function exportItems(){dl('الأصناف',[['الصنف','الكمية','سعر الشراء','سعر البيع']].concat(S.items.map(i=>[i.name,i.qty,i.cost,i.price])))}
let sf='',st='';
function stmtView(id){
 const p=P(id);if(!p)return go('parties');$('#ttl').textContent='كشف حساب: '+p.name;
 const co=localStorage.getItem('es_co')||'';let r=0;const rows=[];
 S.txs.filter(t=>t.pid===id).forEach(t=>{const d=delta(t);if(sf&&t.d<sf){r+=d;return}if(st&&t.d>st)return;r+=d;rows.push({t,d,r})});
 const first=rows.length?rows[0].r-rows[0].d:r,fb=x=>(p.type==='customer'?(x>=0?'عليه ':'له '):(x>=0?'له ':'عليه '))+fmt(Math.abs(x));
 html(`<div class="card no-print"><label>اسم الشركة (يظهر في الكشف)</label><input value="${esc(co)}" oninput="localStorage.setItem('es_co',this.value);$('#pco').textContent=this.value">
 <div style="display:flex;gap:8px"><div style="flex:1"><label>من تاريخ</label><input type="date" value="${sf}" onchange="sf=this.value;stmtView('${id}')"></div><div style="flex:1"><label>إلى تاريخ</label><input type="date" value="${st}" onchange="st=this.value;stmtView('${id}')"></div></div>
 <button class="btn" onclick="print()">🖨️ طباعة / حفظ PDF</button><button class="btn sec" onclick="waSend('${id}')">📤 إرسال ملخص على واتساب</button></div>
 <div class="card"><h2 id="pco" style="text-align:center;margin:0 0 6px">${esc(co)}</h2><div style="text-align:center;font-weight:bold">كشف حساب ${p.type==='customer'?'عميل':'مورد'}: ${esc(p.name)}</div>
 <div style="text-align:center">${p.phone?esc(p.phone)+' · ':''}${sf||st?'الفترة: '+(sf||'...')+' إلى '+(st||'...'):'حتى تاريخ '+today()}</div>
 <div style="overflow-x:auto"><table style="font-size:13px"><tr><th>التاريخ</th><th>البيان</th><th>مستحقات</th><th>مدفوعات / مرتجعات</th><th>الرصيد</th></tr>
 ${sf?`<tr><td colspan="4">رصيد سابق</td><td>${fmt(first)}</td></tr>`:''}
 ${rows.map(({t,d,r})=>`<tr><td>${t.d}</td><td>${K[t.k]} ${t.no||''} ${esc(t.note||'')}</td><td>${d>0?fmt(d):''}</td><td>${d<0?fmt(-d):''}</td><td>${fmt(r)}</td></tr>`).join('')}</table></div>
 <div class="row"><span>الرصيد الحالي</span><b>${fb(r)}</b></div></div>`)}
function waSend(id){
 const p=P(id),co=localStorage.getItem('es_co')||'';const L=[];S.txs.filter(t=>t.pid===id).forEach(t=>L.push(t.d+' '+K[t.k]+' '+fmt(t.total)));
 const msg=(co?co+'\n':'')+'كشف حساب: '+p.name+'\nالرصيد الحالي: '+balTxt(p)+'\n\nآخر الحركات:\n'+L.slice(-8).join('\n');
 let ph=(p.phone||'').replace(/\D/g,'');if(ph.startsWith('0'))ph='2'+ph;
 window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(msg),'_blank')}
function aging(ty){
 ty=typeof ty==='string'?ty:'customer';const now=new Date(today()),T=[0,0,0,0];
 const list=S.parties.filter(p=>p.type===ty).map(p=>{
  const tx=S.txs.filter(t=>t.pid===p.id).sort((a,b)=>a.d.localeCompare(b.d)||(a.ts||0)-(b.ts||0));let cr=0;const deb=[];
  tx.forEach(t=>{const d=delta(t);if(d>0)deb.push({d:t.d,a:d});else cr-=d});
  deb.forEach(x=>{const u=Math.min(x.a,cr);x.a-=u;cr-=u});
  const b=[0,0,0,0];deb.forEach(x=>{if(x.a<=0.005)return;const days=Math.floor((now-new Date(x.d))/864e5);b[days<=30?0:days<=60?1:days<=90?2:3]+=x.a});
  return{p,b,tot:b.reduce((a,c)=>a+c,0)}}).filter(x=>x.tot>0.005).sort((a,b)=>b.tot-a.tot);
 list.forEach(x=>x.b.forEach((v,i)=>T[i]+=v));
 html(`<div class="seg no-print">${[['customer','العملاء'],['supplier','الموردين']].map(([k,l])=>`<button class="${k===ty?'on':''}" onclick="aging('${k}')">${l}</button>`).join('')}</div>
 <div class="card"><h3 style="margin:0 0 8px;text-align:center">أعمار الديون — ${ty==='customer'?'مستحق من العملاء':'مستحق للموردين'} — ${today()}</h3>
 <div style="overflow-x:auto"><table style="font-size:12px"><tr><th>الاسم</th><th>0-30 يوم</th><th>31-60</th><th>61-90</th><th>+90</th><th>الإجمالي</th></tr>
 ${list.map(x=>`<tr onclick="go('stmt','${x.p.id}')" style="cursor:pointer"><td style="text-align:right">${esc(x.p.name)}</td>${x.b.map(v=>'<td>'+(v?fmt(v):'-')+'</td>').join('')}<td><b>${fmt(x.tot)}</b></td></tr>`).join('')||'<tr><td colspan="6">لا توجد مديونيات</td></tr>'}
 <tr><th>الإجمالي</th>${T.map(v=>'<th>'+fmt(v)+'</th>').join('')}<th>${fmt(T.reduce((a,c)=>a+c,0))}</th></tr></table></div>
 <div class="empty">المدفوعات والمرتجعات بتتحسب على أقدم فاتورة الأول.</div></div>
 <button class="btn no-print" onclick="print()">🖨️ طباعة / حفظ PDF</button>`)}
const lowItems=()=>S.items.filter(i=>i.min>0&&i.qty<=i.min);
function count(){
 html(`<div class="card"><div class="empty" style="padding:0 0 8px">اكتب الكمية الفعلية اللي عدّيتها. الفرق بيتعدّل في المخزون ويتسجل في سجل النشاط.</div>
 ${S.items.map(i=>`<div class="row"><div>${esc(i.name)}<small>بالنظام: ${fmt(i.qty)}</small></div><input type="number" inputmode="decimal" style="width:90px" placeholder="الفعلي" data-id="${i.id}" oninput="cdiff(this)"><b style="width:60px;text-align:left"></b></div>`).join('')||'<div class="empty">لا توجد أصناف</div>'}
 <button class="btn" onclick="applyCount()">اعتماد التسوية</button></div>`)}
function cdiff(el){const it=I(el.dataset.id),b=el.nextElementSibling;if(el.value===''){b.textContent='';return}const d=+el.value-it.qty;b.textContent=d?(d>0?'+':'')+fmt(d):'✓';b.className=d<0?'neg':d>0?'pos':''}
function applyCount(){const ch=[];document.querySelectorAll('[data-id]').forEach(el=>{if(el.value==='')return;const it=I(el.dataset.id),n=+el.value;if(!it||n===it.qty)return;ch.push(it.name+': '+fmt(it.qty)+' ← '+fmt(n));it.qty=n;persist('items',it)});if(!ch.length)return toast('لا توجد فروق');logIt('تسوية جرد: '+ch.join('، '));save();toast('تمت التسوية');go('stock')}
function stock(a){
 const v=S.items.reduce((a,i)=>a+i.qty*i.cost,0);
 html(`<div class="card"><button class="btn sec" style="margin:0" onclick="go('item')">+ صنف جديد</button><button class="btn sec" onclick="go('count')">📋 جرد وتسوية المخزون</button><button class="btn sec" onclick="go('stock','${a==='low'?'':'low'}')">${a==='low'?'عرض كل الأصناف':'⚠️ عرض النواقص فقط'}</button><div class="tot">قيمة المخزون: <b>${fmt(v)}</b></div></div>
 <input placeholder="🔍 بحث" oninput="filt(this.value)" style="margin-bottom:10px"><div class="card srch">${S.items.filter(i=>a!=='low'||(i.min>0&&i.qty<=i.min)).map(i=>`<div class="row" onclick="go('item','${i.id}')"><div>${esc(i.name)}<small>شراء ${fmt(i.cost)} · بيع ${fmt(i.price)}</small></div><b class="${i.qty<=0||(i.min>0&&i.qty<=i.min)?'neg':''}">${fmt(i.qty)}</b></div>`).join('')||'<div class="empty">لا توجد أصناف</div>'}</div>`)}

function cash(){
 const L=S.txs.map((t,i)=>({t,i,c:cashOf(t)})).filter(x=>x.c).sort((a,b)=>a.t.d.localeCompare(b.t.d)||a.i-b.i);let r=0;L.forEach(x=>{r+=x.c;x.r=r});
 html(`<div class="stat"><div><small>رصيد الخزينة</small><b>${fmt(r)}</b></div></div><div class="card">${L.reverse().map(x=>{const p=P(x.t.pid);return`<div class="row"><div>${K[x.t.k]}<small>${x.t.d} ${p?esc(p.name):''} ${esc(x.t.note)}</small></div><div style="text-align:left" class="${x.c>0?'pos':'neg'}">${x.c>0?'+':''}${fmt(x.c)}<small>${fmt(x.r)}</small></div><button class="x" style="color:var(--pri)" onclick="go('inv','${x.t.id}')">🖨</button>${canD()?`<button class="x" onclick="delTx('${x.t.id}')">🗑</button>`:''}</div>`}).join('')||'<div class="empty">لا توجد حركات</div>'}</div>`)}

function rep(per){
 per=typeof per==='string'?per:'day';const td=today();
 const X=S.txs.filter(t=>per==='all'||(per==='range'?(t.d>=rf&&t.d<=rt):per==='day'?t.d===td:t.d.slice(0,7)===td.slice(0,7)));
 const sm=k=>X.filter(t=>t.k===k).reduce((a,t)=>a+t.total,0),cg=k=>X.filter(t=>t.k===k).reduce((a,t)=>a+t.lines.reduce((b,l)=>b+l.q*(l.c||0),0),0);
 const sales=sm('sale'),ret=sm('return'),pur=sm('purchase')-sm('preturn'),exp=sm('expense'),inc=sm('income'),profit=sales-ret-(cg('sale')-cg('return'))+inc-exp;
 const sb=t=>S.parties.filter(p=>p.type===t).reduce((a,p)=>a+bal(p.id),0),stk=S.items.reduce((a,i)=>a+i.qty*i.cost,0);
 const R=(l,v,c)=>`<div class="row"><span>${l}</span><b class="${c||''}">${fmt(v)}</b></div>`;
 html(`<div class="seg">${[['day','اليوم'],['month','الشهر'],['range','فترة'],['all','الكل']].map(([k,l])=>`<button class="${k===per?'on':''}" onclick="rep('${k}')">${l}</button>`).join('')}</div>
 ${per==='range'?`<div class="card"><label>من</label><input type="date" value="${rf}" onchange="rf=this.value;rep('range')"><label>إلى</label><input type="date" value="${rt}" onchange="rt=this.value;rep('range')"></div>`:''}<div class="card">${R('المبيعات',sales)}${R('المرتجعات',ret)}${R('المشتريات',pur)}${R('إيرادات أخرى',inc)}${R('المصروفات',exp)}${R('صافي الربح التقريبي',profit,profit>=0?'pos':'neg')}</div>
 <div class="card">${R('مستحق من العملاء',sb('customer'))}${R('مستحق للموردين',sb('supplier'))}${R('قيمة المخزون (بسعر الشراء)',stk)}${R('رصيد الخزينة',S.txs.reduce((a,t)=>a+cashOf(t),0))}</div>
 <div class="empty">الربح = المبيعات − المرتجعات − تكلفة البضاعة المباعة + الإيرادات − المصروفات</div>`)}
function backup(){html(`<div class="card"><button class="btn sec" style="margin:0 0 12px" onclick="firebase.auth().signOut()">تسجيل خروج</button><button class="btn" style="margin:0" onclick="exportData()">⬇️ تصدير نسخة احتياطية</button><button class="btn sec" onclick="exportCSV()">📊 تصدير الحركات (Excel)</button><button class="btn sec" onclick="exportItems()">📦 تصدير الأصناف (Excel)</button>${canD()?`<label>استرجاع من نسخة سابقة</label><input type="file" accept=".json" onchange="importData(this.files[0])">`:''}</div><div class="empty">البيانات مشتركة بين كل الشركاء على السيرفر. خد نسخة احتياطية كل فترة.<br>حسابك: ${esc(who())} (${{admin:'مدير',staff:'موظف',viewer:'عرض فقط'}[ROLE]})</div>`)}
function exportData(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='easystore-backup-'+today()+'.json';a.click()}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.parties||!d.items||!d.txs)throw 0;S=d;S.parties.forEach(x=>persist('parties',x));S.items.forEach(x=>persist('items',x));S.txs.forEach(x=>persist('txs',x));save();toast('تم الاسترجاع');go('home')}catch(e){toast('ملف غير صالح')}};r.readAsText(f)}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(!window.FB_CONFIG||/PASTE/.test(FB_CONFIG.apiKey)){$('#back').style.visibility='hidden';html('<div class="card"><b>لم يتم ربط التطبيق بقاعدة البيانات بعد.</b><div class="empty">افتح ملف www/firebase-config.js والصق بيانات مشروع Firebase (راجع README).</div></div>')}
else{firebase.initializeApp(FB_CONFIG);DB=firebase.firestore();DB.enablePersistence({synchronizeTabs:true}).catch(()=>{});
firebase.auth().onAuthStateChanged(u=>{if(!u){unsubs.forEach(x=>x());unsubs=[];loginScreen()}else{setRole(u.email);startSync();go('home')}})}
</script></body></html>
